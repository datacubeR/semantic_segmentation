[project]
name = "deadtrees"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.8.5",
    "ipykernel<7.0.0",
    "ipywidgets>=8.1.8",
    "lightning>=2.6.1",
    "matplotlib>=3.10.8",
    "pdbpp>=0.12.1",
    "pydantic>=2.13.0",
    "rasterio>=1.5.0",
    "rich>=15.0.0",
    "scikit-learn>=1.8.0",
    "segmentation-models-pytorch>=0.5.0",
    "tensorboard>=2.20.0",
    "torch>=2.11.0",
    "torchvision>=0.22.0",
    "torchgeo>=0.9.0",
    "torchinfo>=1.8.0",
    "torchio>=1.0.2",
    "torchmetrics>=1.9.0",
    "transformers>=5.9.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true