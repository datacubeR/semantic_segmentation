checkpoint_path: null

debug: false
model_name: &model_name swin
dataset_name: LoveDA
max_epochs: 50
save_top_k: 1
batch_size: 2
val_test_batch_size: 2
grad_accumulation_batches: 128
lr: 1e-3
weight_decay: 1e-4
precision: bf16-mixed

in_channels: &in_channels 3
n_classes: &n_classes 8

###############################
# Modifiable Parameters:
###############################
image_size: 1024

use_scheduler: true
scheduler_monitor: val_metrics/miou
lr_scheduler_kwargs: 
  mode: max
  factor: 0.5
  patience: 5
  threshold: 0.005
  threshold_mode: abs
  min_lr: 1e-6

loss_function: null ## cross_entropy, dice_loss, focal_loss, null, etc.
loss_kwargs: null

model: *model_name
model_kwargs:
  pretrained_model_name_or_path: "openmmlab/upernet-swin-tiny"
  num_labels: *n_classes
  ignore_mismatched_sizes: true
  loss_ignore_index: 0