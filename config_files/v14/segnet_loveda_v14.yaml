checkpoint_path: null

debug: False
model_name: &model_name segnet
dataset_name: LoveDA
max_epochs: 1
save_top_k: 1
batch_size: 2
val_test_batch_size: 2
grad_accumulation_batches: 32
lr: 1e-3
weight_decay: 1e-4
precision: bf16-mixed

in_channels: &in_channels 3
n_classes: &n_classes 8

###############################
# Parámetros Modificables:
###############################
image_size: 1024

loss_function: cross_entropy ## cross_entropy, dice_loss, focal_loss, etc.
loss_kwargs:
  ignore_index: 0

model: *model_name
model_kwargs:
  in_channels: *in_channels
  out_channels: *n_classes