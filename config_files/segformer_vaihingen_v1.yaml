checkpoint_path: null

debug: true
model_name: &model_name segformer
dataset_name: Vaihingen
version: v1
max_epochs: 1
batch_size: 8
grad_accumulation_batches: 32
lr: !!float 1e-3
weight_decay: !!float 1e-4
precision: 16-mixed

in_channels: &in_channels 3
n_classes: &n_classes 6

# Parámetros Modificables:
patch_size: 256
overlap: 32

loss_function: dice_loss ## cross_entropy, dice_loss, focal_loss, etc.
loss_kwargs:
  mode: multiclass
  classes: *n_classes
  from_logits: true
  smooth: !!float 1e-8

model: *model_name
model_kwargs:
  encoder_name: mit_b4
  encoder_depth: 5
  encoder_weights: imagenet
  in_channels: *in_channels
  classes: *n_classes