checkpoint_path: null

debug: false
model_name: &model_name upernet
dataset_name: Vaihingen
max_epochs: 50
save_top_k: 1
batch_size: 32
grad_accumulation_batches: 32
lr: 1e-3
weight_decay: 1e-4
precision: bf16-mixed

in_channels: &in_channels 3
n_classes: &n_classes 6

###############################
# Parámetros Modificables:
###############################
patch_size: 256
overlap: 128

use_scheduler: false
scheduler_monitor: val_metrics/miou
lr_scheduler_kwargs: 
  mode: max
  factor: 0.5
  patience: 5
  threshold: 0.005
  threshold_mode: abs
  min_lr: 1e-6

loss_function: cross_entropy ## cross_entropy, dice_loss, focal_loss, etc.
loss_kwargs:
  ignore_index: -100

model: *model_name
model_kwargs:
  encoder_name: tu-convnext_small
  encoder_depth: 5
  encoder_weights: imagenet
  in_channels: *in_channels
  classes: *n_classes