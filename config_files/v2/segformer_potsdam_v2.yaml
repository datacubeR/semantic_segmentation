checkpoint_path: null

debug: false
model_name: &model_name segformer
dataset_name: Potsdam
max_epochs: 50
save_top_k: 1
batch_size: 32
grad_accumulation_batches: 32
lr: 1e-3
weight_decay: 1e-4
precision: bf16-mixed

in_channels: &in_channels 3
n_classes: &n_classes 6

###############################
# Parámetros Modificables:
###############################
patch_size: 256
overlap: 128

loss_function: cross_entropy ## cross_entropy, dice_loss, focal_loss, etc.
loss_kwargs:
  ignore_index: -100

model: *model_name
model_kwargs:
  encoder_name: mit_b4
  encoder_depth: 5
  encoder_weights: imagenet
  in_channels: *in_channels
  classes: *n_classes