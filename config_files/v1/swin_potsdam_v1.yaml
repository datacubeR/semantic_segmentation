checkpoint_path: null

debug: false
model_name: &model_name swin
dataset_name: Potsdam
max_epochs: 50
save_top_k: 1
batch_size: 32
grad_accumulation_batches: 32
lr: 1e-3
weight_decay: 1e-4
precision: bf16-mixed

in_channels: &in_channels 3
n_classes: &n_classes 6

###############################
# Parámetros Modificables:
###############################
patch_size: 256
overlap: 128

loss_function: null ## cross_entropy, dice_loss, focal_loss, null, etc.
loss_kwargs: null

model: *model_name
model_kwargs:
  pretrained_model_name_or_path: "openmmlab/upernet-swin-tiny"
  num_labels: *n_classes
  ignore_mismatched_sizes: true