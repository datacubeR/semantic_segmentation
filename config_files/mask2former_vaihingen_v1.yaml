checkpoint_path: null

debug: false
model_name: &model_name mask2former
dataset_name: Vaihingen
version: v1
max_epochs: 1
batch_size: 4
grad_accumulation_batches: 32
lr: 1e-3
weight_decay: 1e-4
precision: 16-mixed

in_channels: &in_channels 3
n_classes: &n_classes 6

# Parámetros Modificables:
patch_size: 256
overlap: 128

loss_function: dice_loss ## cross_entropy, dice_loss, focal_loss, etc.
loss_kwargs:
  mode: multiclass
  classes: *n_classes
  from_logits: true
  smooth: 1e-8

model: *model_name
model_kwargs:
  pretrained_model_name_or_path: "facebook/mask2former-swin-small-ade-semantic"
  num_labels: *n_classes
  ignore_mismatched_sizes: true